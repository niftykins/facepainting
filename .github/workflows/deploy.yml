name: Deploy to GitHub Pages

on:
  # push:
    # branches:
      # - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish dist to gh-pages
        run: |
          git subtree push --prefix dist origin gh-pages
